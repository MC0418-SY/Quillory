<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quillory – Create post</title>
    
    <link rel="icon" type="image/png" href="../assets/quillory-icon.png">
    <!-- Quill Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/post-styles.css" />
    <link rel="stylesheet" href="../styles/global.css" />
  </head>

  <body>
        <header>
      <div class="title"><a href="dashboard.html">Quillory</a></div>
      <nav>
        <ul>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="post.html" class="nav-link">Create Post</a></li>
        </ul>
      </nav>
      <a href="profile.html" class="profile-link" aria-label="Profile">
        <img id="header-profile-img" src="https://via.placeholder.com/35" alt="Profile" class="header-profile-img" />
      </a>
    </header>

    <main class="content-area">
      <section id="post" class="view-section">
        <div class="post-container">
          <div class="post-header">
            <button class="drafts" id="saveDraftBtn" title="Save draft">Save draft</button>
            <button class="publish" id="publishBtn" title="Publish post">Publish</button>
          </div>

          <div class="post-editor">
            <input type="text" id="postTitle" placeholder="Enter post title..." />
            <div class="tags-container">
              <input type="text" id="postTags" placeholder="Enter tags (e.g., Tech, Fiction)..." />
            </div>

            <!-- Quill Editor Mounts Here -->
            <div id="editor"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Quill JavaScript -->
     <script src="../javascript/global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script src="../javascript/post.js"></script>
      

  </body>
</html>
