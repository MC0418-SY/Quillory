<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quillory – Edit Post</title>
    <script src="../javascript/global.js"></script>
    <link rel="icon" type="image/png" href="../assets/quillory-icon.png">
    <!-- Quill Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/edit-styles.css" />
    <link rel="stylesheet" href="../styles/global.css" />
  </head>

  <body>
    <header>
      <div class="title"><a href="dashboard.html">Quillory</a></div>
      <nav>
        <ul>
          <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
          <li><a href="post.html" class="nav-link">Create Post</a></li>
        </ul>
      </nav>
      <a href="profile.html" class="profile-link" aria-label="profile">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="white" class="profile-icon" viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
        </svg>
      </a>
    </header>

    <main class="content-area">
      <section id="post" class="view-section">
        <div class="post-container">
          <div class="post-header">
            <button class="drafts" id="cancelBtn" title="Cancel edit">Cancel</button>
            <button class="publish" id="updateBtn" title="Update post">Update</button>
          </div>

            <div class="post-editor">
              <input type="text" id="postTitle" placeholder="Enter post title..." />
              
              <!-- NEW: Tags Input -->
              <div class="tags-container">
                <input type="text" id="postTags" placeholder="Enter tags (e.g., Tech, Fiction)..." />
              </div>

              <!-- Quill Editor Mounts Here -->
              <div id="editor"></div>
            </div>


        </div>
      </section>
    </main>

    <!-- Quill JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <!-- Custom Edit JS -->
    <script src="../javascript/edit.js"></script>
  </body>
</html>
