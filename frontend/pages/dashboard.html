<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Quillory</title>
    <!-- FIXED PATHS: Only use ../ to go up one folder -->
    <link rel="icon" type="image/png" href="../assets/quillory-icon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    <link rel="stylesheet" href="../styles/dashboard.css" />
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body>
    <header>

      <div class="title"><a href="dashboard.html">Quillory</a></div>
      <nav>
        <ul>
          <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
          <li><a href="post.html" class="nav-link">Create Post</a></li>
        </ul>
      </nav>
      
        <a href="profile.html" class="profile-link" aria-label="Profile">
            <img id="header-profile-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='35' height='35' viewBox='0 0 120 120'><rect width='120' height='120' fill='%23333'/><circle cx='60' cy='50' r='25' fill='%23ccc'/><path d='M15 120 a45 45 0 0 1 90 0' fill='%23ccc'/></svg>" alt="Profile" class="header-profile-img" />
        </a>
    </header>

    <main class="content-area">
      <div class="dashboard-summary">
        <h2>Welcome to Quillory!</h2>
        <p>Here you can see all your published posts. Stay creative and keep sharing!</p>
      </div>

            <div class="filter-bar">
        <!-- NEW SEARCH BAR -->
        <div class="search-container">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" id="search-bar" placeholder="Search posts by title, content, or author..." />
        </div>
        
        <label for="recency-filter">Sort By:</label>
        <select id="recency-filter">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
        
        
        
        <label for="category-filter">Category:</label>
        <select id="category-filter">
          <option value="all">All Categories</option>
        </select>
      </div>

      <section class="view-section">
        <div id="postsFeed" class="post-feed"></div>
      </section>

    </main>
    <button class="new-post-btn" aria-label="Create New Post">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
      </svg>
    </button>

        <!-- Author Modal -->
    <div id="author-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn">&times;</button>
            <div class="modal-profile">
                <img id="modal-avatar" src="" alt="Avatar" class="modal-avatar-img" />
                <h3 id="modal-username"></h3>
                <p id="modal-bio" class="modal-bio"></p>
                <div id="modal-socials" class="modal-socials"></div>
            </div>
        </div>
    </div>
    
    <script src="../javascript/global.js"></script>
    <script src="../javascript/dashboard.js"></script>
  </body>
</html>
