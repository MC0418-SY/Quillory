version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quillory
      MYSQL_USER: quillory_user
      MYSQL_PASSWORD: quillory_pass
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: quillory_user
      DB_PASSWORD: quillory_pass
      DB_NAME: quillory
    depends_on:
      - db